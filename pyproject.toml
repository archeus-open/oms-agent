[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omsagent"
version = "0.1.0"
description = "Prototype agentic AI order management system (OMS) for a hedge fund"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
    "mcp>=1.6,<2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rag = ["sentence-transformers>=2.6", "faiss-cpu>=1.7"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
